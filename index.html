<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRI Training Simulator</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overscroll-behavior: none;
    background: #11151a;
    color: #e8edf2;
    font-family: Arial, "Noto Sans JP", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  #game-wrap {
    width: min(92vw, 720px);
  }

  #title {
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 0.12em;
    font-size: 22px;
  }

  #game {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 2px solid #6f7d89;
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      #1b2229;
    background-size: 32px 32px;
    touch-action: none;
    user-select: none;
  }

  #hud {
    position: absolute;
    inset: 0 0 auto 0;
    height: 48px;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(8, 12, 16, 0.85);
    border-bottom: 1px solid #56636e;
    z-index: 10;
    font-size: 14px;
  }

  .hud-item span {
    color: #8f9ca7;
    margin-right: 6px;
  }

  #player {
    position: absolute;
    width: 52px;
    height: 28px;
    left: calc(50% - 26px);
    bottom: 18px;
    border: 2px solid #dce5ec;
    background: #5c6872;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }

  .bullet {
    position: absolute;
    width: 5px;
    height: 16px;
    background: #e9f4ff;
    box-shadow: 0 0 8px rgba(220, 240, 255, 0.8);
    border-radius: 3px;
  }

  .enemy {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #8a6d4b;
    border: 2px solid #d5c1a5;
    transform: rotate(45deg);
  }

  #message {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(5, 8, 11, 0.82);
    z-index: 20;
  }

  #message-box {
    text-align: center;
    padding: 30px;
    width: min(85%, 430px);
    border: 1px solid #71808c;
    background: #161c21;
  }

  #message-title {
    font-size: 24px;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  #message-text {
    color: #aeb8c0;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  button {
    border: 1px solid #9ba8b3;
    background: #2a333b;
    color: #fff;
    padding: 11px 28px;
    cursor: pointer;
    font-size: 15px;
  }

  button:hover {
    background: #394650;
  }

  #controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    height: 54px;
  }

  .control-button {
    flex: 1;
    border: 1px solid #71808c;
    background: #252e35;
    color: #e8edf2;
    font-size: 22px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .control-button:active {
    background: #3a4750;
  }

  #fire-button {
    flex: 1.4;
    font-size: 16px;
    letter-spacing: 0.08em;
  }

  #help {
    text-align: center;
    color: #89959e;
    font-size: 12px;
    margin-top: 9px;
  }

  @media (max-width: 600px) {
    body {
      align-items: flex-start;
      padding-top: 16px;
    }

    #game-wrap {
      width: 96vw;
    }

    #title {
      font-size: 18px;
    }

    #help {
      font-size: 11px;
    }
  }
</style>
</head>

<body>
<div id="game-wrap">
  <div id="title">GRI TRAINING SIMULATOR</div>

  <div id="game">
    <div id="hud">
      <div class="hud-item"><span>SCORE</span><b id="score">0000</b></div>
      <div class="hud-item"><span>TIME</span><b id="time">30</b></div>
      <div class="hud-item"><span>TARGET</span><b id="target">0</b></div>
    </div>

    <div id="player"></div>

    <div id="message">
      <div id="message-box">
        <div id="message-title">TRAINING MODE</div>
        <div id="message-text">
          制限時間30秒。<br>
          出現する対象を撃破してください。<br>
          STARTをタップして開始します。
        </div>
        <button id="start-button" type="button">START</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="control-button" id="left-button" type="button" aria-label="左へ移動">◀</button>
    <button class="control-button" id="fire-button" type="button" aria-label="攻撃">FIRE</button>
    <button class="control-button" id="right-button" type="button" aria-label="右へ移動">▶</button>
  </div>

  <div id="help">スマホ：左右ボタンで移動・FIREで攻撃　｜　PC：← → / A D・SPACE</div>
</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const targetEl = document.getElementById("target");
const message = document.getElementById("message");
const messageTitle = document.getElementById("message-title");
const messageText = document.getElementById("message-text");
const startButton = document.getElementById("start-button");
const leftButton = document.getElementById("left-button");
const rightButton = document.getElementById("right-button");
const fireButton = document.getElementById("fire-button");

let playerX = 0;
let bullets = [];
let enemies = [];
let score = 0;
let targets = 0;
let timeLeft = 30;
let gameRunning = false;
let lastTime = 0;
let spawnTimer = 0;
let countdownTimer = null;
let animationId = null;

const keys = {};

document.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    e.preventDefault();
    if (gameRunning) shoot();
  }
});

document.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

game.addEventListener("pointerdown", (e) => {
  if (gameRunning && !e.target.closest("button")) shoot();
});

startButton.addEventListener("click", startGame);
startButton.addEventListener("touchend", (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

let touchLeft = false;
let touchRight = false;

function bindMoveButton(button, direction) {
  const setPressed = (pressed) => {
    if (direction === -1) touchLeft = pressed;
    if (direction === 1) touchRight = pressed;
  };

  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    setPressed(true);
  });

  button.addEventListener("pointerup", (e) => {
    e.preventDefault();
    setPressed(false);
  });

  button.addEventListener("pointercancel", () => setPressed(false));
  button.addEventListener("pointerleave", () => setPressed(false));
}

bindMoveButton(leftButton, -1);
bindMoveButton(rightButton, 1);

fireButton.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (gameRunning) shoot();
});

function startGame() {
  cancelAnimationFrame(animationId);
  clearInterval(countdownTimer);

  bullets.forEach(b => b.el.remove());
  enemies.forEach(e => e.el.remove());

  bullets = [];
  enemies = [];
  score = 0;
  targets = 0;
  timeLeft = 30;
  playerX = (game.clientWidth - player.offsetWidth) / 2;

  scoreEl.textContent = "0000";
  timeEl.textContent = "30";
  targetEl.textContent = "0";

  message.style.display = "none";
  gameRunning = true;
  lastTime = performance.now();
  spawnTimer = 0;

  countdownTimer = setInterval(() => {
    if (!gameRunning) return;

    timeLeft--;
    timeEl.textContent = String(timeLeft);

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);

  animationId = requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (!gameRunning) return;

  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updatePlayer(delta);
  updateBullets(delta);
  updateEnemies(delta);
  handleCollisions();

  spawnTimer += delta;
  if (spawnTimer >= 0.75) {
    spawnEnemy();
    spawnTimer = 0;
  }

  animationId = requestAnimationFrame(gameLoop);
}

function updatePlayer(delta) {
  const speed = 360;
  const direction =
    ((keys["arrowright"] || keys["d"] || touchRight) ? 1 : 0) -
    ((keys["arrowleft"] || keys["a"] || touchLeft) ? 1 : 0);

  playerX += direction * speed * delta;

  const maxX = game.clientWidth - player.offsetWidth;
  playerX = Math.max(0, Math.min(maxX, playerX));

  player.style.left = playerX + "px";
}

function shoot() {
  const bullet = document.createElement("div");
  bullet.className = "bullet";
  game.appendChild(bullet);

  const x = playerX + player.offsetWidth / 2 - 2.5;
  const y = player.offsetTop - 16;

  bullet.style.left = x + "px";
  bullet.style.top = y + "px";

  bullets.push({
    el: bullet,
    x: x,
    y: y,
    speed: 520
  });
}

function updateBullets(delta) {
  bullets = bullets.filter(b => {
    b.y -= b.speed * delta;
    b.el.style.top = b.y + "px";

    if (b.y < -20) {
      b.el.remove();
      return false;
    }

    return true;
  });
}

function spawnEnemy() {
  const enemy = document.createElement("div");
  enemy.className = "enemy";
  game.appendChild(enemy);

  const size = 30;
  const x = Math.random() * (game.clientWidth - size);
  const y = -size;

  enemy.style.left = x + "px";
  enemy.style.top = y + "px";

  enemies.push({
    el: enemy,
    x: x,
    y: y,
    size: size,
    speed: 90 + Math.random() * 70
  });
}

function updateEnemies(delta) {
  enemies = enemies.filter(e => {
    e.y += e.speed * delta;
    e.el.style.top = e.y + "px";

    if (e.y > game.clientHeight + 20) {
      e.el.remove();
      return false;
    }

    return true;
  });
}

function handleCollisions() {
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];

      if (
        b.x < e.x + e.size &&
        b.x + 5 > e.x &&
        b.y < e.y + e.size &&
        b.y + 16 > e.y
      ) {
        b.el.remove();
        e.el.remove();

        bullets.splice(bi, 1);
        enemies.splice(ei, 1);

        score += 100;
        targets++;

        scoreEl.textContent = String(score).padStart(4, "0");
        targetEl.textContent = String(targets);

        break;
      }
    }
  }
}

function endGame() {
  gameRunning = false;
  clearInterval(countdownTimer);
  cancelAnimationFrame(animationId);

  messageTitle.textContent = "TRAINING COMPLETE";
  messageText.innerHTML =
    "訓練終了。<br>撃破数：" + targets + "<br>スコア：" + score;

  startButton.textContent = "RESTART";
  message.style.display = "flex";
}
</script>
</body>
</html>
